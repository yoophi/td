name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate release tag and CI
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/check-release-tag.sh

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Homebrew distribution
        run: |
          {
            echo '### Homebrew'
            echo 'yoophi/homebrew-tap checks stable releases hourly using its own Actions token.'
            echo 'For an immediate update, run the Update td formula workflow in yoophi/homebrew-tap.'
          } >> "$GITHUB_STEP_SUMMARY"
